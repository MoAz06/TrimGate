[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trimgate"
dynamic = ["version"]
description = "Deterministic, test-time auditor that checks an enterprise RAG pipeline does not surface a chunk to an unauthorized identity."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0 AND CC-BY-4.0"
license-files = ["LICENSE", "NOTICE", "LICENSES/CC-BY-4.0.txt"]
authors = [{ name = "Mohamed Azahrioui" }]
keywords = ["rag", "access-control", "security-trimming", "pytest", "ci", "auditor"]
dependencies = [
  "PyYAML>=6.0",
  "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]
azure = [
  "azure-search-documents>=11.4",
  "azure-identity>=1.15",
]

[project.scripts]
trimgate = "trimgate.cli:main"

[project.entry-points.pytest11]
trimgate = "trimgate.plugin"

[tool.hatch.version]
path = "src/trimgate/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/trimgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/trimgate"]

[[tool.mypy.overrides]]
module = ["azure.*"]
ignore_missing_imports = true
